<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVT Seconde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#daf0d7; --surface:#ffffff; --ink:#1d2227; --ink-2:#3a4148; --muted:#5c6e5a; --line:#c2e0bd; --line-2:#abd1a5;
  --ok:#2f7d4f; --ok-soft:#e8f3ec; --ko:#b8412f; --ko-soft:#f8e9e5;
  --c:#1f7a8c; --c-soft:rgba(31,122,140,.08); --c-mid:rgba(31,122,140,.22); --c-ink:#15535f;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --ease:cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:1rem;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:var(--c-ink)}
sup,sub{line-height:0}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}

/* ---------- Barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.01em}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs button{color:var(--muted);padding:8px 0}
.crumbs .cur{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}

main{padding:clamp(22px,5vw,44px) 0 56px}
.view{animation:appear .4s var(--ease)}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kicker{font-size:.76rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin:0 0 8px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.005em}

/* ---------- Accueil ---------- */
.home-head h1{font-size:clamp(2rem,4vw + 1rem,2.9rem);line-height:1.1;margin:0 0 8px}
.home-head .lead{color:var(--muted);margin:0 0 34px;font-size:1rem}
.chapter{margin-bottom:38px}
.ch-head{border-top:3px solid var(--c);padding-top:12px;margin-bottom:14px}
.ch-head .kicker{margin-bottom:2px}
.ch-head h2{margin:0;font-size:clamp(1.2rem,1.2vw + .9rem,1.45rem);line-height:1.3}
.parts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.part .pid{grid-row:span 3;font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--c);line-height:1.2;min-width:30px}
.part h3{margin:0;font-size:1.1rem;line-height:1.3}
.part .pq{margin:4px 0 0;font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:.95rem;line-height:1.5}
.part .go{margin-top:10px;font-size:.85rem;font-weight:600;color:var(--c-ink)}
@media (hover:hover){.part:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 8px 20px -14px rgba(0,0,0,.3)}}
.revise{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.revise h3{margin:0;font-size:1.1rem}
.revise p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:.93rem;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);text-decoration:none;transition:background .2s,border-color .2s,color .2s,transform .12s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--c);border-color:var(--c);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--c-ink);padding-left:0;padding-right:0}
@media (hover:hover){.btn:hover{border-color:var(--c)}.btn.solid:hover{background:var(--c-ink);border-color:var(--c-ink)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- En-tête de partie ---------- */
.hero{margin-bottom:20px}
.hero h1{font-size:clamp(1.65rem,3vw + 1rem,2.5rem);line-height:1.15;margin:0 0 14px}
.probl{margin:0;padding:4px 0 4px 16px;border-left:3px solid var(--c);font-family:var(--serif);font-style:italic;font-size:clamp(1rem,.5vw + .9rem,1.12rem);color:var(--ink-2);line-height:1.55;max-width:62ch}
.probl span{display:block;font-family:var(--sans);font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:2px}

/* ---------- Onglets ---------- */
.tabs{position:sticky;top:52px;z-index:20;background:var(--paper);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line);margin:0 0 24px}
.tabs button{position:relative;min-width:0;min-height:48px;padding:10px 4px;font-weight:600;font-size:.94rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.tabs button::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--c);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{transform:scaleX(1)}

/* ---------- Activités ---------- */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;transition:border-color .25s}
.acc.open{border-color:var(--line-2)}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;min-height:64px}
.acc-head .t{flex:1;min-width:0}
.acc-head .type{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:2px}
.acc-head .name{display:block;font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.35}
.chev{flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .35s var(--ease)}
.open > .acc-head .chev,.open > .more-btn .chev{transform:rotate(225deg);margin-bottom:-4px}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.open > .fold{grid-template-rows:1fr}
.fold > div{overflow:hidden;min-height:0}
.acc-body{padding:0 18px 20px}
.summary{font-family:var(--serif);font-size:1.02rem;line-height:1.65;color:var(--ink-2);margin:0 0 16px}
.corr-title{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.corr-item{margin:0 0 14px}
.corr-item .cq{display:flex;gap:10px;align-items:baseline;font-weight:600;font-size:.93rem;margin-bottom:3px}
.corr-item .cq b{flex:0 0 auto;font-size:.74rem;color:var(--c-ink);background:var(--c-soft);border-radius:6px;padding:1px 7px}
.corr-item .ca{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.6}
.ext{display:inline-flex;margin-top:4px;font-weight:600;font-size:.9rem;color:var(--c-ink);text-decoration:none;min-height:40px;align-items:center}

/* ---------- Tableaux (en cartes sur téléphone) ---------- */
.tbl{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:none}
.tbl thead th{background:var(--c-soft);color:var(--c-ink);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tbl tbody th{font-weight:600}
.tbl caption{caption-side:top;text-align:left;padding:10px 12px 0;font-size:.82rem;color:var(--muted)}
@media (max-width:560px){
  .tbl{border:none;background:none;overflow:visible}
  .tbl caption{padding:0 0 8px}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .tbl tbody th{background:var(--c-soft);color:var(--c-ink);border-bottom:1px solid var(--line)}
  .tbl td{display:flex;justify-content:space-between;gap:14px;text-align:right;border-bottom:1px solid var(--line)}
  .tbl td:last-child{border-bottom:none}
  .tbl td::before{content:attr(data-label);text-align:left;color:var(--muted);font-size:.84rem;flex:0 0 42%}
}

/* ---------- L'essentiel ---------- */
.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-6px 0 26px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.toc button{font-size:.88rem;color:var(--c-ink);font-weight:600;min-height:36px;text-align:left}
.toc button span{font-family:var(--serif);margin-right:6px}
.lesson{max-width:none}
.lesson section{margin-bottom:34px;scroll-margin-top:110px}
.lesson h2{font-size:clamp(1.25rem,1vw + 1rem,1.5rem);line-height:1.3;margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.lesson h2 .num{color:var(--c);font-weight:700;flex:0 0 auto}
.lesson p{font-family:var(--serif);font-size:clamp(1.02rem,.3vw + .98rem,1.1rem);line-height:1.75;margin:0 0 14px;color:var(--ink);hyphens:auto;-webkit-hyphens:auto}
.lesson b{font-weight:700}
.aside{margin:18px 0;padding:14px 18px;background:var(--c-soft);border-radius:10px}
.aside .lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:4px}
.aside p{font-size:.98rem;line-height:1.65;margin:0}
.recap{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:18px 20px;margin-top:10px}
.recap .lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink);margin-bottom:6px}
.recap p{margin:0}
.recap p + p{margin-top:10px}
.recap p.rt{font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--ink-2);margin-top:16px}
.recap .lab + p.rt{margin-top:4px}
.recap p.rt + p{margin-top:4px}
.facts{margin:0;padding-left:20px}
.facts li{font-family:var(--serif);font-size:.98rem;line-height:1.6;margin:3px 0}
.aside .src{font-size:.8rem;color:var(--muted);margin-top:6px}
.hint-line{font-size:.85rem;color:var(--muted);margin:0 0 20px}
.hint-line .term{pointer-events:none}

/* Termes avec définition */
.term{font:inherit;color:inherit;display:inline;padding:0;border-bottom:1.5px dotted var(--c);cursor:help;border-radius:2px;transition:background .2s}
.term.active,.term:focus-visible{background:var(--c-mid);outline:none}
@media (hover:hover){.term:hover{background:var(--c-soft)}}
.tip{position:absolute;z-index:50;top:0;left:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px 12px;font-size:.9rem;line-height:1.5;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .18s,transform .18s,visibility .18s}
.tip.show{opacity:1;visibility:visible;transform:none}
.tip b{display:block;font-family:var(--serif);font-size:1rem;margin-bottom:2px;color:#fff}
.tip .arrow{position:absolute;top:-6px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.tip.above .arrow{top:auto;bottom:-6px}

/* ---------- Navigation entre parties ---------- */
.next-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.next-nav button{text-align:left;max-width:48%;min-height:44px}
.next-nav button:last-child{text-align:right;margin-left:auto}
.next-nav small{display:block;color:var(--muted);font-size:.78rem}
.next-nav span{font-family:var(--serif);font-weight:600;color:var(--c-ink)}
@media (max-width:560px){.next-nav button{max-width:100%}}

/* ---------- Flashcards ---------- */
.fc-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.pills{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.pills button{min-height:36px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);transition:background .2s,color .2s}
.pills button.on{background:var(--ink);color:var(--paper)}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;max-width:620px;margin:0 auto 16px}
.bar > i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s var(--ease)}
.scene{perspective:1400px;max-width:620px;margin:0 auto;touch-action:pan-y}
.flash{position:relative;width:100%;height:clamp(250px,50vw,340px);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .6s var(--ease);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.flash.in{animation:slin .35s var(--ease)}
.flash.in-back{animation:slback .35s var(--ease)}
@keyframes slin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slback{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.face{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px clamp(18px,4vw,34px) 30px;text-align:center;overflow:auto}
.face.front{background:var(--surface);border:1px solid var(--line-2);border-top:4px solid var(--c)}
.face.back{background:var(--c);color:#fff;transform:rotateY(180deg)}
.face .lab{position:absolute;top:12px;left:16px;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.face .code{position:absolute;top:10px;right:14px;font-size:.72rem;font-weight:700;color:var(--c-ink)}
.face.back .code{color:#fff;opacity:.8}
.face .term-big{font-family:var(--serif);font-size:clamp(1.4rem,2.2vw + .9rem,2rem);font-weight:700;line-height:1.25}
.face .def{font-family:var(--serif);font-size:clamp(1.02rem,.6vw + .88rem,1.2rem);line-height:1.55}
.face .hint{position:absolute;bottom:10px;font-size:.76rem;opacity:.45}
.fc-count{text-align:center;color:var(--muted);font-size:.86rem;margin:12px 0 2px}
.fc-know{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:620px;margin:10px auto 0}
.fc-know .no{color:var(--ko);background:var(--ko-soft);border-color:transparent}
.fc-know .yes{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.fc-ctrl{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;max-width:620px;margin:10px auto 0}
.fc-ctrl .btn{padding:0}
.fc-ctrl .arrow{font-size:1.3rem}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fc-grid .scene{max-width:none;width:100%;margin:0}
.fc-grid .flash{height:190px}
.fc-grid .face{padding:28px 14px 14px;border-radius:12px}
.fc-grid .face .term-big{font-size:1.12rem}
.fc-grid .face .def{font-size:.9rem}
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(22px,5vw,38px);text-align:center;max-width:620px;margin:0 auto}
.done .big{font-family:var(--serif);font-size:clamp(2.3rem,5vw + 1rem,3.2rem);font-weight:700;color:var(--c);line-height:1}
.done p{color:var(--muted)}
.done .row{justify-content:center;margin-top:16px}

/* ---------- QCM ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,30px);max-width:700px;margin:0 auto}
.panel h3{margin:0 0 4px;font-size:1.25rem}
.muted{color:var(--muted);font-size:.9rem}
.set-label{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;font-size:.88rem;color:var(--ink-2);transition:all .2s}
.chips button small{color:var(--muted);font-weight:500;margin-left:4px}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.chips button.on small{color:rgba(255,255,255,.8)}
.chips button:disabled{opacity:.35;cursor:default}
.q-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.84rem;margin-bottom:8px}
.lvl{font-weight:600;color:var(--c-ink)}
.q-text{font-family:var(--serif);font-size:clamp(1.12rem,.8vw + .95rem,1.3rem);font-weight:600;line-height:1.45;margin:16px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:52px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.97rem;transition:border-color .2s,background .2s,opacity .2s}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--muted)}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--c)}}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.5}
.feedback{margin-top:16px;padding:13px 16px;border-radius:10px;font-size:.95rem;animation:appear .3s var(--ease)}
.feedback.ok{background:var(--ok-soft)}
.feedback.ko{background:var(--ko-soft)}
.feedback b{display:block;margin-bottom:2px}
.feedback.ok b{color:var(--ok)}
.feedback.ko b{color:var(--ko)}
.q-next{display:flex;justify-content:flex-end;margin-top:14px}
.score{font-family:var(--serif);font-size:clamp(2.6rem,6vw + 1rem,3.6rem);font-weight:700;color:var(--c);line-height:1;margin:6px 0 4px}
.center{text-align:center}
.more-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;color:var(--c-ink);min-height:44px}
.more-btn .chev{width:8px;height:8px;border-color:var(--c-ink);margin:0 2px 3px}
.review-item{border-top:1px solid var(--line);padding:12px 0;font-size:.93rem;text-align:left}
.review-item .r-ok{color:var(--ok);font-weight:600}
.review-item .r-ko{color:var(--ko);font-weight:600}

/* ---------- Téléphones ---------- */
@media (max-width:480px){
  body{font-size:.97rem}
  main{padding-top:20px}
  .topbar .wrap{min-height:48px}
  .tabs{top:48px}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;font-size:.8rem;min-height:46px;padding:10px 5px;overflow:visible;text-overflow:clip}
  .tabs button::after{left:6px;right:6px}
  .parts{grid-template-columns:1fr}
  .part{padding:16px}
  .acc-head{padding:14px 14px}
  .acc-body{padding:0 14px 18px}
  .fc-tools{justify-content:center}
  .pills button{padding:6px 10px;font-size:.8rem}
  .panel{padding:18px 16px}
}
/* ---------- Barre du haut : glossaire et réglages ---------- */
.topbar .wrap{position:relative}
.top-actions{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.tbtn{white-space:nowrap;flex:0 0 auto;min-height:36px;padding:6px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:.86rem;font-weight:600;background:var(--surface);transition:border-color .2s}
.tbtn.on{border-color:var(--ink)}
@media (hover:hover){.tbtn:hover{border-color:var(--ink)}}
.settings{position:absolute;right:clamp(16px,4vw,32px);top:calc(100% + 6px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 14px 34px -14px rgba(0,0,0,.35);display:none;z-index:40}
.settings.show{display:block;animation:appear .25s var(--ease)}
.settings .set-label:first-child{margin-top:0}
.settings .pills{display:flex}
.settings .pills button{flex:1}
.settings .note{font-size:.8rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- Réglages de lecture ---------- */
/* Thèmes : papier (par défaut), clair, sombre */
html.th-clair{--paper:#ffffff;--surface:#ffffff;--ink:#000000;--ink-2:#1a1a1a;--muted:#4d4d4d;--line:#e3e3e3;--line-2:#cdcdcd}
html.th-sombre{color-scheme:dark;--paper:#16191c;--surface:#1f2327;--ink:#ebe8e2;--ink-2:#d3cfc7;--muted:#9ba1a7;--line:#2e3439;--line-2:#3d444b;--ok:#62c78f;--ok-soft:rgba(98,199,143,.14);--ko:#ef8472;--ko-soft:rgba(239,132,114,.15)}
html.th-sombre .face.back,html.th-sombre .btn.solid,html.th-sombre .chips button.on{background:var(--c-deep,var(--c));border-color:var(--c-deep,var(--c))}
html.th-sombre .btn.solid:hover{background:var(--c);border-color:var(--c)}
html.th-sombre .tip,html.th-sombre .tip .arrow{background:#2e3439}
html.th-sombre .tip{border:1px solid #454d54;color:#ebe8e2}
html.th-sombre .part:hover,html.th-sombre .settings{box-shadow:0 14px 34px -14px rgba(0,0,0,.8)}
.nav-btn{display:none}
.nav-btn.show{display:inline-flex;align-items:center}
.brand.hide{display:none}
html.f-lex{--serif:'Lexend',system-ui,sans-serif;--sans:'Lexend',system-ui,sans-serif}
html.f-lex .probl,html.f-lex .part .pq{font-style:normal}
html.sp-wide body{letter-spacing:.03em;word-spacing:.12em}
html.sp-wide .lesson p,html.sp-wide .aside p,html.sp-wide .recap p,html.sp-wide .summary,html.sp-wide .corr-item .ca,html.sp-wide .model,html.sp-wide .gl-item p{line-height:1.95}
html.sp-wide .lesson p,html.sp-wide .aside p,html.sp-wide .recap p,html.sp-wide .summary,html.sp-wide .corr-item .ca,html.sp-wide .probl,html.sp-wide .part .pq,html.sp-wide .feedback,html.sp-wide .review-item .muted,html.sp-wide .model{text-align:left;-webkit-hyphens:manual;hyphens:manual}

/* ---------- Glossaire ---------- */
.gl-search{display:block;width:100%;font:inherit;font-size:1.05rem;padding:13px 16px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);margin:0 0 8px;-webkit-appearance:none;appearance:none}
.gl-info{font-size:.86rem;color:var(--muted);margin:0 0 10px;min-height:1.3em}
.gl-letter{font-family:var(--serif);font-weight:700;color:var(--ink-2);font-size:1.15rem;margin:22px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line-2)}
.gl-item{padding:13px 0;border-bottom:1px solid var(--line)}
.gl-item h3{margin:0 0 3px;font-size:1.08rem}
.gl-item p{margin:0;font-family:var(--serif);line-height:1.6}
.gl-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.gl-tags button{font-size:.78rem;font-weight:600;color:var(--c-ink);background:var(--c-soft);border-radius:6px;padding:3px 10px;min-height:30px}
mark{background:var(--c-mid);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- Accueil ---------- */
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.extras .revise{flex-wrap:nowrap}


@media (max-width:520px){.crumbs{display:none}}

/* ---------- Halloween (actif seulement si HALLOWEEN = true dans les réglages) ---------- */
html.hw main{position:relative}
html.hw .brand{white-space:nowrap}
@media (max-width:420px){html.hw .brand{font-size:16px}html.hw .brand .hw-p{margin-left:.25em}}
@media (max-width:360px){html .topbar .brand{font-size:14px}html.hw .brand .hw-p{display:none}}
html.hw main > .wrap{position:relative;z-index:1}
.hw-web{position:absolute;top:0;width:clamp(70px,12vw,170px);height:clamp(70px,12vw,170px);color:var(--muted);opacity:.42;pointer-events:none;z-index:0}
.hw-web.l{left:0}
.hw-web.r{right:0;transform:scaleX(-1)}
.hw-web svg{display:block;width:100%;height:100%}
html.th-sombre .hw-web{opacity:.4}
.hw-p{display:inline-block;width:1.15em;height:1.08em;vertical-align:-.14em;margin-left:.35em;line-height:0}
.hw-p svg{display:block;width:100%;height:100%;overflow:visible}
.hw-p .pf{fill:#3a2208;transition:fill .3s}
.foot .hw-p{margin:0 .45em 0 0}
html.hw .home-head{position:relative}
.hw-big{position:absolute;right:0;top:2px;width:clamp(46px,9vw,68px);height:clamp(44px,8.5vw,64px);padding:0;margin:0;cursor:pointer;transition:transform .2s var(--ease)}
.hw-big .hw-p{width:100%;height:100%;margin:0;vertical-align:0}
@media (hover:hover){.hw-big:hover{transform:rotate(-6deg) scale(1.06)}}
.hw-big:focus-visible{outline:2px solid #e2771a;outline-offset:4px;border-radius:12px}
.hw-big.lit .pf{fill:#ffd84a}
.hw-big.lit svg{filter:drop-shadow(0 0 10px rgba(255,170,40,.75))}
.hw-big.lit{animation:hwWig .6s var(--ease)}
@keyframes hwWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}55%{transform:rotate(9deg)}80%{transform:rotate(-4deg)}}
.hw-rain{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:none}
.hw-rain .hw-p{position:absolute;top:0;margin:0;animation:hwFall linear forwards;will-change:transform}
@keyframes hwFall{from{transform:translateY(-80px) rotate(0)}to{transform:translateY(calc(100vh + 80px)) rotate(var(--rot))}}
@media (max-width:480px){html.hw .home-head h1{padding-right:56px}}

/* ---------- Surligneur ---------- */
.surl{color:inherit;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.surl.sj{background:rgba(253,224,71,.62)}
.surl.sv{background:rgba(134,239,172,.62)}
.surl.sb{background:rgba(147,197,253,.65)}
.surl.sr{background:rgba(249,168,212,.62)}
html.th-sombre .surl.sj{background:rgba(250,204,21,.38)}
html.th-sombre .surl.sv{background:rgba(74,222,128,.32)}
html.th-sombre .surl.sb{background:rgba(96,165,250,.38)}
html.th-sombre .surl.sr{background:rgba(244,114,182,.36)}
html.surl-on .surl{cursor:pointer}
html.surl-on .opt,html.surl-on .opt *,html.surl-on button.term,html.surl-on .face{-webkit-user-select:text;user-select:text}
html.surl-ok main{padding-bottom:110px}
.surl-fab{position:fixed;right:16px;bottom:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:45;width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 8px 20px -8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .15s}
.surl-fab:active{transform:scale(.94)}
.surl-fab svg{width:26px;height:26px}
.surl-bar{position:fixed;left:50%;bottom:12px;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:46;display:none;flex-direction:column;gap:8px;width:max-content;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);letter-spacing:normal;word-spacing:normal}
html.surl-on .surl-bar{display:flex;animation:surlIn .25s var(--ease)}
@keyframes surlIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
html.surl-on .surl-fab{display:none}
.surl-hint{margin:0;font-size:13px;line-height:1.35;color:var(--muted);text-align:center}
.surl-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.surl-col{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.surl-col.on{box-shadow:0 0 0 2px var(--ink)}
.surl-col[data-c="sj"]{background:#fde047}.surl-col[data-c="sv"]{background:#86efac}.surl-col[data-c="sb"]{background:#93c5fd}.surl-col[data-c="sr"]{background:#f9a8d4}
.surl-row .btn{min-height:40px;padding:7px 16px;font-size:14px}
.surl-col{width:38px;height:38px}
.surl-tool{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--ink-2)}
.surl-tool svg{width:20px;height:20px}
.surl-tool.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
html.surl-gomme .surl{cursor:pointer;outline:1.5px dashed rgba(0,0,0,.35);outline-offset:1px}
html.th-sombre.surl-gomme .surl{outline-color:rgba(255,255,255,.4)}
html.surl-cache .surl-fab,html.surl-cache .surl-bar{display:none!important}
html.surl-cache main{padding-bottom:56px}
.surl-msg{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:47;background:var(--ink);color:var(--paper);font-size:14px;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px);text-align:center}
.surl-msg.show{opacity:1}

/* ---------- Glossaire : tri par chapitre ---------- */
.gl-filters{margin:4px 0 12px}
.gl-filters .chips + .chips,.gl-chname + .chips{margin-top:8px}
.gl-chname{margin:10px 0 0;font-size:.86rem;color:var(--muted)}
.chips.small button{min-height:34px;padding:4px 12px;font-size:.82rem}

/* ---------- Méthodes ---------- */
.hl-v,.hl-e,.hl-b{color:inherit;border-radius:4px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-v{background:rgba(250,214,40,.5)}
.hl-e{background:rgba(110,205,95,.42)}
.hl-b{background:rgba(96,165,250,.42)}
.meth-card{background:#e3eefc;border-color:#a9c8ee;margin-bottom:30px}
html.th-sombre .meth-card{background:rgba(80,150,240,.14);border-color:rgba(96,165,250,.45)}
.meth-card h3 mark{font-weight:700}
.part.nonum{grid-template-columns:1fr}
.meth-card{cursor:pointer;transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.meth-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,80,150,.14)}
.meth-card:active{transform:translateY(0)}
.meth-card:focus-visible{outline:2px solid #3b82d6;outline-offset:2px}
.m-steps{counter-reset:st;list-style:none;padding:0;margin:0 0 26px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.m-steps li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 56px}
.m-steps li::before{counter-increment:st;content:counter(st);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.m-steps h3{margin:2px 0 10px;font-size:1.08rem}
.m-steps p{margin:0 0 10px;line-height:1.55;font-size:.95rem}
.m-steps p:last-child{margin:0}
.m-opt{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px}
.m-lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.m-ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:26px}
.m-ex p{margin:0 0 14px;line-height:1.65}
.m-ex>p:last-child{margin-bottom:0}
.m-rep{border-left:3px solid var(--c);padding-left:16px}
.m-rep p{font-family:var(--serif);margin:0 0 8px;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
/* Barre du haut : taille fixe, pour qu'elle tienne sur un petit téléphone même en A++ / espacement élargi */
.topbar{letter-spacing:normal;word-spacing:normal}
@media (max-width:480px){.topbar .tbtn{font-size:13px;padding:6px 9px}.topbar .brand{font-size:16px}.top-actions{gap:4px}}
@media (max-width:360px){.topbar .tbtn{font-size:12px;padding:6px 7px}.topbar .wrap{gap:6px}}

/* Fiche méthode en tableau (une étape par ligne) */
.m-flow{list-style:none;counter-reset:st;margin:0 0 18px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.m-flow li{display:grid;grid-template-columns:minmax(170px,30%) 1fr;gap:6px 24px;align-items:start;padding:16px 22px;border-top:1px solid var(--line)}
.m-flow li:first-child{border-top:none}
.mf-t{display:flex;align-items:center;gap:12px;font-weight:700;line-height:1.3;min-height:28px}
.mf-t::before{counter-increment:st;content:counter(st);flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.mf-d{display:block;line-height:1.6;text-align:left;padding-top:2px}
.mf-n{display:block;margin-top:4px;font-size:.9rem;font-style:italic;color:var(--muted)}
.m-out{background:var(--c-soft);border-radius:var(--r);padding:16px 22px;line-height:1.6}
.m-out p{margin:0;text-align:left}
.m-out p + p{margin-top:6px;font-size:.93rem;color:var(--ink-2)}
@media (max-width:600px){.m-flow li{grid-template-columns:1fr;padding:14px 16px}.mf-d{padding:0 0 0 40px}.m-out{padding:14px 16px}}
.m-err{margin:0;padding-left:20px}
.m-err li{margin:8px 0;line-height:1.55}

/* ---------- Pied de page ---------- */
.foot{border-top:1px solid var(--line);padding:18px 0 22px;padding-bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font-size:.8rem;color:var(--muted)}

/* ---------- Tuto ---------- */
.tuto{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,22,.45)}
.tuto.show{display:flex;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tuto-box{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden;animation:appear .35s var(--ease)}
.tuto-box{min-height:min(510px,calc(100vh - 32px))}
@media (max-width:560px){.tuto-box{min-height:min(640px,calc(100vh - 32px))}}
.tuto-body{flex:1;padding:26px clamp(18px,5vw,30px) 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tuto-body h2{margin:0 0 12px;font-size:clamp(1.3rem,1.5vw + 1rem,1.6rem);line-height:1.25}
.tuto-body p{margin:0 0 12px;line-height:1.6;color:var(--ink-2)}
.tuto-body ul{margin:0 0 12px;padding-left:0;list-style:none}
.tuto-body li{position:relative;padding-left:18px;margin:0 0 9px;line-height:1.55;color:var(--ink-2)}
.tuto-body li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--c)}
.tuto-body li b,.tuto-body p b{color:var(--ink)}
.tuto-step{animation:appear .3s var(--ease)}
.tuto-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:10px;font-size:1.4rem;line-height:1;color:var(--muted);z-index:1}
@media (hover:hover){.tuto-x:hover{background:var(--paper);color:var(--ink)}}
.tuto-demo{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.tuto-demo span{font-size:.8rem;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--c-soft);color:var(--c-ink)}
.tuto-demo .dterm{background:none;padding:0;border-radius:0;font-size:1rem;font-weight:400;font-family:var(--serif);color:var(--ink);border-bottom:1.5px dotted var(--c)}
.tuto-foot{display:flex;align-items:center;gap:10px;padding:14px clamp(18px,5vw,30px) 18px;border-top:1px solid var(--line)}
.tuto-dots{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
.tuto-dots button{width:22px;height:28px;display:flex;align-items:center;justify-content:center}
.tuto-dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:background .2s,transform .2s}
.tuto-dots button.on::before{background:var(--c);transform:scale(1.3)}
.tuto-foot .btn{min-width:108px}
.tuto-foot .btn.ghost{min-width:0;padding:10px 6px}
@media (max-width:480px){.tuto-foot .btn{min-width:0}.tuto-dots button{width:16px}}
@media (max-width:420px){.back-lbl{display:none}.tbtn{padding:6px 9px}.top-actions{gap:4px}}

/* Texte justifié (avec césure pour éviter les grands espaces) */
.lesson p,.aside p,.recap p,.summary,.corr-item .ca,.probl,.part .pq,.feedback,.review-item .muted{text-align:justify;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="topbar"><div class="wrap"><button class="tbtn nav-btn" id="backBtn" aria-label="Retour">←<span class="back-lbl">&nbsp;Retour</span></button><button class="tbtn nav-btn" id="homeBtn">Accueil</button><button class="brand" id="brand">SVT · Seconde</button><nav class="crumbs" id="crumbs"></nav><div class="top-actions"><button class="tbtn" id="tutoBtn" aria-haspopup="dialog">Tuto</button><button class="tbtn" id="glBtn">Glossaire</button><button class="tbtn" id="setBtn" aria-label="Réglages du texte" aria-expanded="false">Aa</button></div><div class="settings" id="settings" role="dialog" aria-label="Réglages du texte"></div></div></div>

<script>
/* =====================================================================
   RÉGLAGES
   OUVRIR_SUR : null = accueil. "1a", "1b"… = ouvre directement la partie
                (utile pour faire une page Google Sites par partie).
   AFFICHER_CORRECTIONS : false pour masquer les corrections.
   ===================================================================== */
var OUVRIR_SUR = null;
var AFFICHER_CORRECTIONS = true;
/* HALLOWEEN : true = toiles et citrouilles affichées. Mettre false pour tout enlever. */
var HALLOWEEN = true;

/* Couleur de chaque chapitre : Chapitre 1 = 1re couleur, etc. */
var COULEURS = ["#1f7a8c", "#bf5a2f", "#7a4fae", "#2f5fae", "#4f8a2f", "#a8435f"];

/* =====================================================================
   COMMENT ÉCRIRE LE CONTENU
   Dans les textes de « L'essentiel » :
     **mot**            → mot en gras
     *texte*            → italique
     [[terme]]          → terme souligné : définition au survol / au toucher
     [[pluriel|terme]]  → affiche « pluriel », définition de « terme »
   Les définitions viennent des flashcards + du GLOSSAIRE ci-dessous.

   QCM : {q: "question", o: ["A","B","C","D"], r: index de la bonne
          réponse (0 = A), e: "explication", n: niveau 1, 2 ou 3}
          n = 1 facile · 2 moyen · 3 difficile
   ===================================================================== */


/* Définitions supplémentaires (termes qui ne sont pas dans les flashcards) */
var GLOSSAIRE = {
 "membrane plasmique": "Enveloppe qui délimite la cellule.",
 "cytoplasme": "Contenu de la cellule, autour du noyau.",
 "noyau": "Partie de la cellule qui contient l'ADN.",
 "micromètre": "Unité de longueur (µm) : un millième de millimètre.",
 "niveau d'organisation": "Échelle à laquelle on décrit le vivant : organisme, organe, tissu, cellule.",
 "actine": "Protéine de la fibre musculaire qui participe à la contraction.",
 "myosine": "Protéine de la fibre musculaire qui participe à la contraction.",
 "corps cellulaire": "Partie du neurone qui contient le noyau.",
 "dendrite": "Prolongement court et ramifié du neurone, qui reçoit des messages.",

     resume: "<b>Pourquoi ce TP ?</b> En 1.d), on a vu que la structure de l'ADN est la même chez tous les êtres vivants, mais que l'ordre des nucléotides peut varier. Il restait à comprendre à quoi sert cet ordre. On est parti d'une situation concrète : devant le même chocolat noir, certaines personnes le trouvent très amer et d'autres peu amer. Pour étudier cette différence, les scientifiques utilisent le PTC, une substance amère.<br><br><b>Ce qu'on a fait.</b> On a formulé une question scientifique, puis conçu un protocole pour tester sa propre sensibilité au PTC : une bandelette témoin, puis une bandelette contenant du PTC, dans les mêmes conditions. On a ensuite comparé avec le logiciel Géniegen2 deux séquences du gène humain TAS2R38, appelées PAV et AVI. Enfin, on a exploité un graphique montrant comment deux formes d'un récepteur des cellules gustatives répondent à des concentrations croissantes de PTC.<br><br><b>À quoi ça nous a servi.</b> À comprendre ce qu'est un gène : une portion d'ADN dont la séquence porte une information. On a vu que cette séquence peut être légèrement différente d'un individu à l'autre, et que ces différences peuvent se traduire par des caractères différents. On s'est aussi entraîné à formuler une question scientifique et à concevoir un protocole avec un témoin.",

function norm(s){

}

/* Historique : le bouton « Retour » et le bouton retour du navigateur
   ramènent à la page précédente du site */
/* Le bouton « Retour » du site utilise sa propre liste de pages (HIST) : il fonctionne
   donc aussi quand le site est intégré dans une autre page (Google Sites), où
   l'historique du navigateur n'est pas fiable. Le bouton retour du navigateur n'est
   synchronisé que si le site est ouvert directement. */
var DANS_CADRE = false;
try { DANS_CADRE = window.self !== window.top; } catch(e){ DANS_CADRE = true; }
var HIST = [], USE_HISTORY = !DANS_CADRE, sautPop = 0, sautTimer = null;
function snap(){ return {view: S.view, niveau: S.niveau, chap: S.chap, partie: S.partie, tab: S.tab, methode: S.methode}; }
function restore(){
  var s = HIST.pop();
  if (s){ S.view = s.view; S.niveau = s.niveau; S.chap = s.chap; S.partie = s.partie; S.tab = s.tab; S.methode = s.methode; } else S.view = 'home';
  render(); toTop();
}
function goBack(){
  if (!HIST.length){ if (S.view !== 'home'){ S.view = 'home'; render(); toTop(); } return; }
  restore();
  /* Recule aussi d'un cran l'historique du navigateur, sans restaurer deux fois */
  if (USE_HISTORY){
    sautPop++;
    clearTimeout(sautTimer); sautTimer = setTimeout(function(){ sautPop = 0; }, 1000);
    try { history.back(); } catch(e){ sautPop = 0; }
  }
}
$('backBtn').onclick = goBack;
window.addEventListener('popstate', function(){
  if (sautPop > 0){ sautPop--; return; }
  if (HIST.length) restore();
});

function go(view, opts){
  opts = opts || {};
  if (!opts.noPush){
    HIST.push(snap());
    if (USE_HISTORY){ try { history.pushState({svt: HIST.length}, ''); } catch(e){ USE_HISTORY = false; } }
  }
  S.view = view;
  if (opts.partie){ S.partie = opts.partie; S.chap = opts.ch; }
  if (opts.tab) S.tab = opts.tab;
  if (opts.methode) S.methode = opts.methode;
  render(); toTop();
}
function render(){
  setKeys(null); hideTip();
  if (!S.niveau && NIVEAUX.length === 1) S.niveau = NIVEAUX[0];
  document.body.style.cssText = S.view === 'partie' ? colorVars(chapColor(S.chap)) : (S.view === 'home' ? '' : colorVars(neutre()));
  renderCrumbs();
  if (S.view === 'partie') renderPartie();
  else if (S.view === 'revision') renderRevision();
  else if (S.view === 'glossaire') renderGlossaire();
  else if (S.view === 'methodes') renderMethodes();
  else if (S.view === 'methode') renderMethode();
  else if (!S.niveau) renderNiveaux();
  else renderNiveau();
}

/* ---------- Glossaire avec recherche tolérante aux fautes ---------- */
function lev(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  var prev = [], cur, i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++){
    cur = [i]; var best = i;
    for (j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function tol(s){ return s.length <= 3 ? 0 : s.length <= 5 ? 1 : s.length <= 8 ? 2 : 3; }
var GLIST = null;
function glossList(){
  if (GLIST) return GLIST;
  GLIST = Object.keys(GLOSS).map(function(k){
    var g = GLOSS[k], dn = norm(g.d);
    return {k: k, g: g, words: k.split(/[^a-z0-9]+/).filter(Boolean), dn: dn, dwords: dn.split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 4; })};
  }).sort(function(a, b){ return a.k < b.k ? -1 : 1; });
  return GLIST;
}
function searchGloss(q){
  var qn = norm(q), toks = qn.split(/[^a-z0-9]+/).filter(function(t){ return t.length >= 2; });
  var toks4 = toks.filter(function(t){ return t.length >= 4; });
  if (!qn) return {list: glossList(), fuzzy: false};
  var res = [], fuzzy = true;
  glossList().forEach(function(e){
    var s = 0;
    if (e.k === qn) s = 1000; else if (e.k.indexOf(qn) === 0) s = 600; else if (e.k.indexOf(qn) > -1) s = 400;
    else if (lev(qn, e.k, tol(qn)) <= tol(qn)) s = 350;
    if (s) fuzzy = false;
    if (!s && toks.length){
      var all = toks.every(function(t){
        return e.words.some(function(w){ return w.indexOf(t) === 0 || lev(t, w, tol(t)) <= tol(t); });
      });
      if (all) s = 250;
    }
    if (e.dn.indexOf(qn) > -1){ s += 80; if (s === 80) fuzzy = false; }
    else if (toks4.length && toks4.every(function(t){ return e.dwords.some(function(w){ return w.indexOf(t) === 0 || lev(t, w, tol(t)) <= tol(t); }); })) s += 40;
    if (s) res.push({e: e, s: s});
  });
  res.sort(function(a, b){ return b.s - a.s || (a.e.k < b.e.k ? -1 : 1); });
  return {list: res.map(function(r){ return r.e; }), fuzzy: fuzzy && res.length > 0};
}
function hl(text, q){
  var t = esc(text); if (!q || q.length < 2) return t;
  try { return t.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); } catch(e){ return t; }
}

/* ---------- Flashcards ---------- */
function renderFlashcards(tab, cards){
  cards = cards.map(function(c){ return Array.isArray(c) ? {t: c[0], d: c[1]} : c; });
  var mode = 'jeu', sens = 'mot', deck, idx, known, review, dir = 1;
  function reset(list){ deck = shuffle(list || cards); idx = 0; known = 0; review = []; dir = 1; }
  reset();

  function faces(c, small){
    var term = '<div class="term-big">' + esc(c.t) + '</div>', def = '<div class="def">' + esc(c.d) + '</div>';
    var f = sens === 'mot' ? [term, def, 'Mot-clé', 'Définition'] : [def, term, 'Définition', 'Mot-clé'];
    var tag = c.tag ? '<span class="code">' + esc(c.tag) + '</span>' : '';
    return '<div class="face front"><span class="lab">' + f[2] + '</span>' + tag + f[0] + (small ? '' : '<span class="hint">Touche la carte pour la retourner</span>') + '</div>'
         + '<div class="face back"><span class="lab">' + f[3] + '</span>' + tag + f[1] + '</div>';
  }
  function cstyle(c){ return c.col ? ' style="' + colorVars(c.col) + '"' : ''; }

  function draw(){
    var h = '<div class="fc-tools"><div class="pills"><button data-m="jeu" class="' + (mode === 'jeu' ? 'on' : '') + '">Une par une</button><button data-m="liste" class="' + (mode === 'liste' ? 'on' : '') + '">Toutes</button></div>'
      + '<div class="pills"><button data-s="mot" class="' + (sens === 'mot' ? 'on' : '') + '">Mot d\'abord</button><button data-s="def" class="' + (sens === 'def' ? 'on' : '') + '">Définition d\'abord</button></div></div>';
    if (mode === 'liste'){
      h += '<div class="fc-grid">';
      cards.forEach(function(c){ h += '<div class="scene"' + cstyle(c) + '><div class="flash">' + faces(c, true) + '</div></div>'; });
      h += '</div>';
      setKeys(null);
    } else if (idx >= deck.length){
      h += '<div class="done"><div class="big">' + known + ' / ' + deck.length + '</div><p>cartes connues</p>'
        + (review.length ? '<p>' + review.length + ' carte' + (review.length > 1 ? 's' : '') + ' à revoir.</p>' : '<p>Parfait, tu connais tout !</p>')
        + '<div class="row">' + (review.length ? '<button class="btn solid" id="again">Revoir les cartes ratées</button>' : '') + '<button class="btn" id="restart">Recommencer</button></div></div>';
      setKeys(null);
    } else {
      var c = deck[idx];
      h += '<div class="bar"><i style="width:' + (idx / deck.length * 100) + '%"></i></div>'
        + '<div class="scene" id="scene"' + cstyle(c) + '><div class="flash ' + (dir > 0 ? 'in' : 'in-back') + '" id="card">' + faces(c) + '</div></div>'
        + '<div class="fc-count">Carte ' + (idx + 1) + ' sur ' + deck.length + '</div>'
        + '<div class="fc-know"><button class="btn no" id="no">À revoir</button><button class="btn yes" id="yes">Je savais</button></div>'
        + '<div class="fc-ctrl"><button class="btn arrow" id="prev" aria-label="Carte précédente">‹</button><button class="btn" id="mix">Mélanger</button><button class="btn arrow" id="next" aria-label="Carte suivante">›</button></div>';
    }
    tab.innerHTML = h;
    tab.querySelectorAll('[data-m]').forEach(function(b){ b.onclick = function(){ mode = b.dataset.m; draw(); }; });
    tab.querySelectorAll('[data-s]').forEach(function(b){ b.onclick = function(){ sens = b.dataset.s; draw(); }; });
    tab.querySelectorAll('.flash').forEach(function(f){ f.onclick = function(){ f.classList.remove('in', 'in-back'); f.classList.toggle('flipped'); }; });
    if ($('again')) $('again').onclick = function(){ reset(review); draw(); };
    if ($('restart')) $('restart').onclick = function(){ reset(); draw(); };
    if (!$('card')) return;
    function next(){ if (idx < deck.length - 1){ idx++; dir = 1; draw(); } }
    function prev(){ if (idx > 0){ idx--; dir = -1; draw(); } }
    function flip(){ var f = $('card'); f.classList.remove('in', 'in-back'); f.classList.toggle('flipped'); }
    $('next').onclick = next; $('prev').onclick = prev;
    $('mix').onclick = function(){ reset(); draw(); };
    $('yes').onclick = function(){ known++; idx++; dir = 1; draw(); };
    $('no').onclick = function(){ review.push(deck[idx]); idx++; dir = 1; draw(); };
    var sx = null, sy = null, sc = $('scene');
    sc.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
    sc.addEventListener('touchend', function(e){
      if (sx === null) return;

    });
    setKeys(function(e){
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();

  }
  draw();
}

/* ---------- QCM ---------- */
function renderQcm(tab, bank, key){
  bank = bank.map(function(q){ return {q: q.q, o: q.o, r: q.r, e: q.e, n: q.n || 2, col: q.col, tag: q.tag}; });
  var lvl = 0, nb = 10, qs, i, score, answers;
  function pool(){ return lvl ? bank.filter(function(q){ return q.n === lvl; }) : bank; }

  function start(list){
    qs = list.map(function(q){
      var order = shuffle(q.o.map(function(_, k){ return k; }));
      return {q: q.q, o: order.map(function(k){ return q.o[k]; }), r: order.indexOf(q.r), e: q.e, n: q.n, col: q.col, tag: q.tag};
    });
    i = 0; score = 0; answers = []; draw();
  }
  function intro(){
    var pl = pool(), best = store(key + '_' + lvl);
    var counts = {0: bank.length, 1: 0, 2: 0, 3: 0};
    bank.forEach(function(q){ counts[q.n]++; });
    var opts = [5, 10, 20].filter(function(v){ return v < pl.length; }).concat([pl.length]);
    if (opts.indexOf(nb) < 0) nb = opts[Math.min(1, opts.length - 1)];
    var h = '<div class="panel"><h3>QCM</h3><p class="muted" style="margin:0">Questions et réponses mélangées à chaque essai.</p>'
      + '<p class="set-label">Niveau</p><div class="chips" id="lv">';
    [0, 1, 2, 3].forEach(function(l){ h += '<button data-l="' + l + '" class="' + (lvl === l ? 'on' : '') + '"' + (counts[l] ? '' : ' disabled') + '>' + (l ? NIVEAUX_LBL[l] : 'Tous niveaux') + '<small>' + counts[l] + '</small></button>'; });
    h += '</div><p class="set-label">Nombre de questions</p><div class="chips" id="nbq">';
    opts.forEach(function(v){ h += '<button data-v="' + v + '" class="' + (v === nb ? 'on' : '') + '">' + (v === pl.length ? 'Toutes (' + v + ')' : v) + '</button>'; });
    h += '</div><div class="row" style="justify-content:space-between;margin-top:22px"><button class="btn solid" id="go">Commencer</button>' + (best ? '<span class="muted">Meilleur score : ' + best + ' %</span>' : '') + '</div></div>';
    tab.innerHTML = h;
    tab.querySelectorAll('#lv button').forEach(function(b){ b.onclick = function(){ lvl = +b.dataset.l; intro(); }; });
    tab.querySelectorAll('#nbq button').forEach(function(b){ b.onclick = function(){ nb = +b.dataset.v; tab.querySelectorAll('#nbq button').forEach(function(x){ x.classList.toggle('on', x === b); }); }; });
    $('go').onclick = function(){ start(shuffle(pool()).slice(0, nb)); };
  }
  function draw(){
    if (i >= qs.length) return end();
    var q = qs[i];
    var h = '<div class="panel view"' + (q.col ? ' style="' + colorVars(q.col) + '"' : '') + '><div class="q-meta"><span>Question ' + (i + 1) + ' / ' + qs.length + (q.tag ? ' · ' + esc(q.tag) : '') + '</span><span class="lvl">' + NIVEAUX_LBL[q.n] + '</span></div>'
      + '<div class="bar" style="max-width:none"><i style="width:' + (i / qs.length * 100) + '%"></i></div>'
      + '<div class="q-text">' + esc(q.q) + '</div><div class="opts">';
    q.o.forEach(function(o, k){ h += '<button class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'[k] + '</span><span>' + esc(o) + '</span></button>'; });
    h += '</div><div id="fb"></div></div>';
    tab.innerHTML = h;
    tab.querySelectorAll('.opt').forEach(function(b){
      b.onclick = function(){
        var k = +b.dataset.k, ok = k === q.r;
        if (ok) score++;
        answers.push({q: q, choix: k, ok: ok});
        tab.querySelectorAll('.opt').forEach(function(x){
          x.disabled = true;
          var xk = +x.dataset.k;
          if (xk === q.r) x.classList.add('good'); else if (xk === k) x.classList.add('bad'); else x.classList.add('dim');
        });
        $('fb').innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'ko') + '"><b>' + (ok ? 'Bonne réponse' : 'Pas tout à fait') + '</b>' + esc(q.e || '') + '</div>'
          + '<div class="q-next"><button class="btn solid" id="nx">' + (i === qs.length - 1 ? 'Voir mon score' : 'Question suivante') + '</button></div>';
        $('nx').onclick = function(){ i++; draw(); };
        setKeys(function(e){ if (e.key === 'Enter'){ e.preventDefault(); setKeys(null); i++; draw(); } });
      };
    });
  }
  function end(){
    setKeys(null);
    var pct = Math.round(score / qs.length * 100), bk = key + '_' + lvl;
    if (pct > (store(bk) || 0)) store(bk, pct);
    var msg = pct >= 90 ? 'Excellent !' : pct >= 70 ? 'Très bien, continue.' : pct >= 50 ? 'Pas mal, revois les points ratés.' : "Relis L'essentiel et les flashcards, puis réessaie.";
    var wrong = answers.filter(function(a){ return !a.ok; });
    var det = '';
    answers.forEach(function(a, n){
      det += '<div class="review-item"><div><b>' + (n + 1) + '.</b> ' + esc(a.q.q) + '</div>'
        + (a.ok ? '<div class="r-ok">✓ ' + esc(a.q.o[a.choix]) + '</div>'
                : '<div class="r-ko">✗ ' + esc(a.q.o[a.choix]) + '</div><div class="r-ok">✓ ' + esc(a.q.o[a.q.r]) + '</div>')
        + '<div class="muted">' + esc(a.q.e || '') + '</div></div>';
    });
    var h = '<div class="panel view center"><div class="score">' + score + ' / ' + qs.length + '</div><p class="muted" style="margin:0">' + pct + ' % · ' + msg + '</p>'
      + '<div class="row" style="justify-content:center;margin:20px 0 10px">' + (wrong.length ? '<button class="btn solid" id="redo">Refaire les ' + wrong.length + ' ratée' + (wrong.length > 1 ? 's' : '') + '</button>' : '') + '<button class="btn" id="again">Nouveau QCM</button></div>'
      + '<div style="text-align:left">' + foldable('Voir la correction détaillée', det) + '</div></div>';
    tab.innerHTML = h;
    bindFolds(tab);
    if ($('redo')) $('redo').onclick = function(){ start(wrong.map(function(a){ return a.q; })); };
    $('again').onclick = intro;
  }
  intro();
}

    dernierAjout = Date.now();
    return true;
  }
  /* Sur téléphone : on attend que le doigt soit levé et que la sélection ne bouge plus */
  var appui = false, attente = null;
  function planifier(){ clearTimeout(attente); attente = setTimeout(function(){ if (actif && !appui) agirSelection(); }, 800); }
  document.addEventListener('touchstart', function(e){ if (!bar.contains(e.target)){ appui = true; clearTimeout(attente); } }, {passive: true});
  document.addEventListener('touchend', function(){ if (actif){ appui = false; planifier(); } }, {passive: true});
  document.addEventListener('mousedown', function(e){ if (!bar.contains(e.target)){ appui = true; clearTimeout(attente); } });
  document.addEventListener('mouseup', function(){ appui = false; });
  document.addEventListener('selectionchange', function(){ if (actif && !appui && selectionUtile()) planifier(); });
  /* Un toucher ou un clic : sélection, surlignage existant, ou mot */
  document.addEventListener('click', function(e){
    if (!actif || bar.contains(e.target) || fab.contains(e.target)) return;
    var stop = function(){ e.preventDefault(); e.stopPropagation(); dernierAjout = Date.now(); };
    if (agirSelection()){ stop(); return; }
    var m = e.target.closest && e.target.closest('mark.surl');
    if (m){ if (outil === 'gomme') retirer([{zone: m.closest('[data-hl]'), i: +m.getAttribute('data-i')}]); else recolorer(m); stop(); return; }
    if (outil === 'couleur'){
      var w = motAuPoint(e.clientX, e.clientY);
      if (w){ ajouter(w.z, w.a, w.b); stop(); return; }
    }
    /* En mode surligneur, un toucher ne retourne pas la flashcard et ne valide pas le QCM */
    if (e.target.closest && e.target.closest('.flash, .opt')) stop();
  }, true);
  document.addEventListener('keydown', function(e){ if (actif && e.key === 'Escape') basculer(false); });
  scanner();
})();

  /* Toile d'araignée (sans araignée) : rayons + fils en arc, depuis le coin */

  /* Pluie de citrouilles : elles tombent du haut de l'écran puis disparaissent */
  function rain(){

  /* Grande citrouille de l'accueil : un clic déclenche la pluie de citrouilles */
  var base = render, timer = null;

<script>

    if (pret) { try { window.goatcounter.count(o); } catch(e){} } else file.push(o);
  }

  window.goatcounter = {no_onload: true, allow_frame: true};

  s.setAttribute('data-goatcounter', COMPTEUR);
  s.onload = function(){ pret = !!(window.goatcounter && window.goatcounter.count); if (pret) file.splice(0).forEach(function(o){ try { window.goatcounter.count(o); } catch(e){} }); };
  document.head.appendChild(s);

  if (typeof render === 'function'){ var r0 = render; render = function(){ r0.apply(this, arguments); suivre(); }; }
  if (typeof switchTab === 'function'){ var t0 = switchTab; switchTab = function(){ t0.apply(this, arguments); suivre(); }; }
  /* Chaque QCM lancé (bouton « Commencer »), où qu'il soit */
  document.addEventListener('click', function(ev){

})();
